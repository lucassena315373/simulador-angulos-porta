<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Ângulos</title>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background:
        linear-gradient(
            120deg,
            #e9e9e9,
            #f4f4f4 45%,
            #d9dce1
        );

    min-height: 100vh;

    overflow-x: hidden;
}


/* =========================================================
   ÁREA PRINCIPAL
========================================================= */

.container {

    width: 100%;
    min-height: 100vh;

    position: relative;

    padding: 25px;

}


/* =========================================================
   TÍTULO
========================================================= */

.title-box {

    position: absolute;

    top: 25px;
    left: 25px;

    width: 460px;

    padding: 18px 22px;

    background:
        linear-gradient(
            135deg,
            #17283d,
            #0d1c2f
        );

    border-radius: 18px;

    color: white;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);

    z-index: 10;
}


.title-box h1 {

    margin: 0;

    font-size: 38px;

}


.title-box p {

    margin: 8px 0 0 0;

    font-size: 20px;

    color: #d7dde6;

}


/* =========================================================
   AMBIENTE DA PORTA
========================================================= */

.room {

    position: absolute;

    left: 0;
    top: 0;

    width: 58%;

    height: 100vh;

    overflow: hidden;

}


/* =========================================================
   PAREDE
========================================================= */

.wall {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 72%;

    background:

        linear-gradient(
            90deg,
            #eeeeee,
            #d9d9d9,
            #f2f2f2
        );

    border-bottom:
        8px solid #777;

}


/* =========================================================
   PISO
========================================================= */

.floor {

    position: absolute;

    bottom: 0;

    width: 100%;
    height: 35%;

    background:

        linear-gradient(
            135deg,
            #777,
            #444
        );

    transform:
        perspective(700px)
        rotateX(55deg);

    transform-origin: bottom;

}


/* =========================================================
   LINHAS DO PISO
========================================================= */

.floor::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    background:

        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 75px,
            rgba(255,255,255,.15) 77px,
            transparent 80px
        ),

        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 110px,
            rgba(255,255,255,.12) 112px,
            transparent 115px
        );

}


/* =========================================================
   PORTAL DA PORTA
========================================================= */

.door-frame {

    position: absolute;

    left: 320px;
    top: 70px;

    width: 420px;
    height: 700px;

    background:

        linear-gradient(
            90deg,
            #151515,
            #353535,
            #111
        );

    padding: 18px;

    box-shadow:

        10px 10px 20px
        rgba(0,0,0,.3);

}


/* =========================================================
   INTERIOR DO PORTAL
========================================================= */

.door-space {

    position: relative;

    width: 100%;
    height: 100%;

    background:

        linear-gradient(
            90deg,
            #202020,
            #111,
            #333
        );

    perspective: 1200px;

}


/* =========================================================
   PORTA
========================================================= */

.door {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 300px;
    height: 610px;

    transform-origin:
        left center;

    transform-style:
        preserve-3d;

    cursor: grab;

    background:

        linear-gradient(
            90deg,

            #5b2d10,

            #8a471b 10%,

            #7a3d16 30%,

            #9a5220 50%,

            #6e3512 75%,

            #4d240d
        );

    border:

        4px solid
        #3c1d0b;

    box-shadow:

        20px 20px 30px
        rgba(0,0,0,.45);

}


/* =========================================================
   TEXTURA DA MADEIRA
========================================================= */

.door::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        repeating-linear-gradient(

            90deg,

            rgba(255,255,255,.04) 0px,

            rgba(0,0,0,.05) 3px,

            transparent 7px,

            transparent 18px

        );

    pointer-events: none;

}


/* =========================================================
   MAÇANETA
========================================================= */

.handle {

    position: absolute;

    right: 30px;

    top: 60%;

    width: 65px;
    height: 18px;

    background:

        linear-gradient(
            180deg,
            #c7c7c7,
            #555
        );

    border-radius: 4px;

    box-shadow:

        4px 5px 8px
        rgba(0,0,0,.4);

}


/* =========================================================
   BASE DA MAÇANETA
========================================================= */

.handle::before {

    content: "";

    position: absolute;

    left: -8px;

    top: -8px;

    width: 20px;
    height: 35px;

    background:

        linear-gradient(
            90deg,
            #555,
            #ddd,
            #444
        );

    border-radius: 3px;

}


/* =========================================================
   DOBRADIÇAS
========================================================= */

.hinge {

    position: absolute;

    left: -9px;

    width: 14px;
    height: 70px;

    background:

        linear-gradient(
            90deg,
            #222,
            #aaa,
            #222
        );

}


.hinge.one {

    top: 90px;

}


.hinge.two {

    top: 400px;

}


/* =========================================================
   PONTO DA DOBRADIÇA
========================================================= */

.hinge-point {

    position: absolute;

    left: -13px;

    bottom: -13px;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    background: white;

    border:

        5px solid
        #222;

}


/* =========================================================
   ARCO DO ÂNGULO
========================================================= */

.angle-visual {

    position: absolute;

    left: 360px;

    bottom: 80px;

    width: 260px;
    height: 260px;

    border-radius:

        100% 0 0 0;

    border-top:

        7px solid
        #4da3ff;

    border-left:

        7px solid
        #4da3ff;

    pointer-events: none;

    opacity: .9;

}


/* =========================================================
   LINHA DE REFERÊNCIA
========================================================= */

.reference-line {

    position: absolute;

    left: 360px;

    bottom: 80px;

    width: 320px;

    border-top:

        5px dashed white;

    transform-origin: left;

}


/* =========================================================
   TEXTO DO ÂNGULO
========================================================= */

.angle-label {

    position: absolute;

    left: 520px;

    bottom: 190px;

    font-size: 38px;

    font-weight: bold;

    color: #8bc5ff;

    text-shadow:

        3px 3px 5px
        rgba(0,0,0,.5);

}


/* =========================================================
   PAINEL DIREITO
========================================================= */

.panel {

    position: absolute;

    right: 50px;

    top: 105px;

    width: 440px;

}


/* =========================================================
   PAINEL PRINCIPAL
========================================================= */

.main-panel {

    background:

        linear-gradient(
            135deg,
            #1a2d45,
            #0e1c2d
        );

    padding: 30px 38px;

    border-radius: 18px;

    color: white;

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.2);

}


/* =========================================================
   TÍTULO DO ÂNGULO
========================================================= */

.current-title {

    font-size: 28px;

    font-weight: bold;

}


/* =========================================================
   VALOR DO ÂNGULO
========================================================= */

.current-angle {

    text-align: center;

    font-size: 82px;

    font-weight: bold;

    margin:

        20px 0;

    color:

        #56a5ff;

    text-shadow:

        0 0 15px
        rgba(86,165,255,.4);

}


/* =========================================================
   LINHA
========================================================= */

.separator {

    height: 2px;

    background:

        rgba(255,255,255,.18);

    margin:

        20px 0;

}


/* =========================================================
   CLASSIFICAÇÃO
========================================================= */

.classification-title {

    font-size: 26px;

    font-weight: bold;

}


.classification {

    margin-top: 15px;

    padding: 15px;

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    border-radius: 12px;

    background:

        linear-gradient(
            135deg,
            #4d9cff,
            #2775c8
        );

}


/* =========================================================
   CAIXA DE INFORMAÇÕES
========================================================= */

.info-panel {

    margin-top: 20px;

    background:

        rgba(255,255,255,.75);

    padding: 22px;

    border-radius: 18px;

    border:

        2px solid
        #b8c7d6;

    color:

        #29394c;

    font-size: 20px;

    line-height: 1.65;

}


/* =========================================================
   CONTROLES
========================================================= */

.controls {

    position: absolute;

    right: 40px;

    bottom: 40px;

    width: 660px;

    background:

        linear-gradient(
            135deg,
            #172b43,
            #0c1929
        );

    border-radius: 22px;

    padding: 25px;

    color: white;

    box-shadow:

        0 10px 25px
        rgba(0,0,0,.25);

}


/* =========================================================
   SLIDER
========================================================= */

.slider-area {

    display: flex;

    align-items: center;

    gap: 20px;

}


.slider-area span {

    font-size: 24px;

    font-weight: bold;

}


input[type="range"] {

    flex: 1;

    height: 12px;

    cursor: pointer;

    accent-color: #55a5ff;

}


/* =========================================================
   BOTÕES
========================================================= */

.quick-title {

    margin-top: 20px;

    font-size: 20px;

}


.buttons {

    display: flex;

    justify-content: space-between;

    margin-top: 12px;

}


.buttons button {

    border: none;

    color: white;

    font-size: 18px;

    font-weight: bold;

    padding: 12px 17px;

    border-radius: 25px;

    cursor: pointer;

    background:

        linear-gradient(
            135deg,
            #314a66,
            #1b2e45
        );

    transition:

        .2s;

}


.buttons button:hover {

    transform:

        scale(1.08);

    background:

        #4b91d8;

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     TÍTULO
===================================================== -->

<div class="title-box">

    <h1>Simulador de Ângulos</h1>

    <p>
        Arraste a porta para ver o valor do ângulo.
    </p>

</div>



<!-- =====================================================
     AMBIENTE
===================================================== -->

<div class="room">


    <div class="wall"></div>


    <div class="floor"></div>



    <!-- PORTAL -->

    <div class="door-frame">


        <div class="door-space">


            <!-- PORTA -->

            <div
                class="door"
                id="door"
            >


                <div
                    class="hinge one"
                ></div>


                <div
                    class="hinge two"
                ></div>


                <div
                    class="handle"
                ></div>


                <div
                    class="hinge-point"
                ></div>


            </div>


        </div>


    </div>



    <!-- VISUALIZAÇÃO DO ÂNGULO -->

    <div
        class="angle-visual"
        id="angleVisual"
    ></div>



    <div
        class="reference-line"
    ></div>



    <div
        class="angle-label"
        id="angleLabel"
    >

        65°

    </div>


</div>



<!-- =====================================================
     PAINEL
===================================================== -->

<div class="panel">


    <div class="main-panel">


        <div class="current-title">

            Ângulo atual:

        </div>



        <div
            class="current-angle"
            id="currentAngle"
        >

            65°

        </div>



        <div
            class="separator"
        ></div>



        <div
            class="classification-title"
        >

            Classificação:

        </div>



        <div
            class="classification"
            id="classification"
        >

            Ângulo agudo

        </div>


    </div>



    <!-- =================================================
         INFORMAÇÕES
    ================================================= -->

    <div class="info-panel">

        ⓘ &nbsp;

        <strong>Ângulo agudo:</strong>
        0° &lt; x &lt; 90°

        <br>

        <strong>Ângulo reto:</strong>
        x = 90°

        <br>

        <strong>Ângulo obtuso:</strong>
        90° &lt; x &lt; 180°

        <br>

        <strong>Ângulo raso:</strong>
        x = 180°

        <br>

        <strong>Ângulo nulo:</strong>
        x = 0°

    </div>


</div>



<!-- =====================================================
     CONTROLES
===================================================== -->

<div class="controls">


    <div class="slider-area">


        <span>

            0°

        </span>


        <input

            type="range"

            id="slider"

            min="0"

            max="180"

            value="65"

        >


        <span>

            180°

        </span>


    </div>



    <div class="quick-title">

        Ângulos rápidos:

    </div>



    <div class="buttons">


        <button onclick="setAngle(0)">
            0°
        </button>


        <button onclick="setAngle(30)">
            30°
        </button>


        <button onclick="setAngle(45)">
            45°
        </button>


        <button onclick="setAngle(60)">
            60°
        </button>


        <button onclick="setAngle(90)">
            90°
        </button>


        <button onclick="setAngle(120)">
            120°
        </button>


        <button onclick="setAngle(150)">
            150°
        </button>


        <button onclick="setAngle(180)">
            180°
        </button>


    </div>


</div>


</div>



<script>


/* =========================================================
   ELEMENTOS
========================================================= */

const door = document.getElementById("door");

const slider = document.getElementById("slider");

const currentAngle =
    document.getElementById("currentAngle");

const angleLabel =
    document.getElementById("angleLabel");

const classification =
    document.getElementById("classification");

const angleVisual =
    document.getElementById("angleVisual");



/* =========================================================
   ÂNGULO ATUAL
========================================================= */

let angle = 65;



/* =========================================================
   ATUALIZAR PORTA
========================================================= */

function updateDoor() {


    /*
        A porta gira em torno da dobradiça.

        O valor do ângulo é usado para
        criar a transformação 3D.
    */


    door.style.transform =

        "rotateY(" +

        (-angle) +

        "deg)";



    /* ==============================================
       ATUALIZAR TEXTO
    ============================================== */


    currentAngle.textContent =

        angle + "°";


    angleLabel.textContent =

        angle + "°";


    slider.value = angle;



    /* ==============================================
       CLASSIFICAÇÃO
    ============================================== */


    if (angle == 0) {


        classification.textContent =

            "Ângulo nulo";


    }


    else if (angle < 90) {


        classification.textContent =

            "Ângulo agudo";


    }


    else if (angle == 90) {


        classification.textContent =

            "Ângulo reto";


    }


    else if (angle < 180) {


        classification.textContent =

            "Ângulo obtuso";


    }


    else {


        classification.textContent =

            "Ângulo raso";


    }



    /* ==============================================
       ARCO DO ÂNGULO
    ============================================== */


    angleVisual.style.transform =

        "rotate(" +

        (-angle / 2) +

        "deg)";


}



/* =========================================================
   SLIDER
========================================================= */

slider.addEventListener(

    "input",

    function() {


        angle =

            Number(slider.value);


        updateDoor();


    }

);



/* =========================================================
   BOTÕES
========================================================= */

function setAngle(value) {


    angle = value;


    updateDoor();


}



/* =========================================================
   ARRASTAR A PORTA
========================================================= */

let dragging = false;



door.addEventListener(

    "mousedown",

    function() {


        dragging = true;


        door.style.cursor =

            "grabbing";


    }

);



document.addEventListener(

    "mouseup",

    function() {


        dragging = false;


        door.style.cursor =

            "grab";


    }

);



document.addEventListener(

    "mousemove",

    function(event) {


        if (!dragging) {

            return;

        }


        /*
            Calcula a posição horizontal
            do mouse na tela.
        */


        let x = event.clientX;



        /*
            Limita o ângulo
            entre 0 e 180 graus.
        */


        let calculatedAngle =

            Math.round(

                (x - 300) / 3

            );



        if (calculatedAngle < 0) {


            calculatedAngle = 0;


        }



        if (calculatedAngle > 180) {


            calculatedAngle = 180;


        }



        angle =

            calculatedAngle;



        updateDoor();


    }

);



/* =========================================================
   INICIALIZAÇÃO
========================================================= */

updateDoor();


</script>


</body>

</html>
